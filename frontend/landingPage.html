<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing</title>
    <link rel="stylesheet" href="/frontend/landingStyles.css" />
</head>

<body>
    <main class="wrap">
        <h1 class="title">Chess</h1>

        <div class="form">
            <label for="username">Nombre</label>

                alt="Pieza de ajedrez" />

            <button id="register" class="play-btn" href="usermenu.html">PLAY</button>
        </div>

    </main>
    <script src="/frontend/landingPage.js"></script>

</html>
